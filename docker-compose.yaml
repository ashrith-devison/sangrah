version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: filevault-backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    restart: unless-stopped
    volumes:
      - backend_storage:/app/storage

  # client:
  #   build:
  #     context: ./client
  #     dockerfile: Dockerfile
  #   container_name: filevault-client
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - NODE_ENV=production
  #   depends_on:
  #     - backend
  #   restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: filevault-postgres
    environment:
      POSTGRES_USER: filevault
      POSTGRES_PASSWORD: securepassword
      POSTGRES_DB: filevaultdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
  backend_storage: